<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t"><title id="t">从单店交付到三层可复用资产</title><rect width="1600" height="900" fill="#11100d"/><g font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="90" y="105" fill="#d6ab73" font-size="20" letter-spacing="5">VALUE / DELIVERY / REUSE</text><text x="90" y="205" fill="#eee5d6" font-size="55" font-weight="600">每一次交付，留下什么？</text><text x="92" y="269" fill="#938879" font-size="23">共性沉淀为能力，差异保留为规则与配置。</text><g stroke="#6c593d"><rect x="90" y="700" width="1410" height="80" fill="#191610"/><rect x="430" y="325" width="730" height="110" fill="#292116"/><rect x="305" y="455" width="980" height="110" fill="#221e15"/><rect x="180" y="585" width="1230" height="110" fill="#191610"/></g><g fill="#eee5d6" text-anchor="middle" font-size="31"><text x="795" y="373">商家差异</text><text x="795" y="503">行业组合</text><text x="795" y="633">通用底座</text></g><g fill="#a29480" text-anchor="middle" font-size="21"><text x="795" y="413">商品 · 收费 · 服务规则 · 执行授权</text><text x="795" y="543">安装 · 赠品 · 排障 · 行业化路径</text><text x="795" y="673">订单定位 · 信息收集 · 状态查询 · 接续</text></g><text x="795" y="750" text-anchor="middle" fill="#d6ab73" font-size="25">看得懂 → 敢授权 → 配得完 → 用得上 → 能验证</text><text x="90" y="841" fill="#887b69" font-size="19">让下一次交付少一些不可复用的工作。</text></g></svg>
