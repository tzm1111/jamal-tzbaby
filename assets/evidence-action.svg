<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t"><title id="t">从具体问题到可验证行动的工作链</title><rect width="1600" height="900" fill="#11100d"/><g font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="90" y="105" fill="#d6ab73" font-size="20" letter-spacing="5">QUESTION / EVIDENCE / ACTION</text><text x="90" y="205" fill="#eee5d6" font-size="55" font-weight="600">不是多一份产物，是推进一次判断。</text><text x="92" y="266" fill="#938879" font-size="23">每一步，都给下一步留下可以使用的东西。</text><path d="M160 465H1440M1440 590V690H160V590" fill="none" stroke="#a38253" stroke-width="2"/><g fill="#17140f" stroke="#6c593d"><rect x="90" y="360" width="252" height="230"/><rect x="382" y="360" width="252" height="230"/><rect x="674" y="360" width="252" height="230"/><rect x="966" y="360" width="252" height="230"/><rect x="1258" y="360" width="252" height="230"/></g><g fill="#d6ab73" font-size="17"><text x="120" y="404">01 / QUESTION</text><text x="412" y="404">02 / EVIDENCE</text><text x="704" y="404">03 / SCENARIO</text><text x="996" y="404">04 / ACTION</text><text x="1288" y="404">05 / VERIFY</text></g><g fill="#eee5d6" font-size="32"><text x="120" y="474">明确问题</text><text x="412" y="474">建立证据</text><text x="704" y="474">拆解场景</text><text x="996" y="474">匹配动作</text><text x="1288" y="474">验证结果</text></g><g fill="#998c7a" font-size="19"><text x="120" y="538">要支持什么决定</text><text x="412" y="538">事实与推断分开</text><text x="704" y="538">保留关键分支</text><text x="996" y="538">责任人与验收</text><text x="1288" y="538">版本与生效范围</text></g><rect x="525" y="655" width="550" height="75" fill="#242016" stroke="#8c7049"/><text x="800" y="703" text-anchor="middle" fill="#d6ab73" font-size="27">修正解释，沉淀方法与失败条件</text><text x="90" y="840" fill="#887b69" font-size="20">生成成功，不等于事实成立或行动完成。</text></g></svg>
