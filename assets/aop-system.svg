<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0b0a09"/><text x="80" y="95" fill="#dda660" font-family="monospace" font-size="22" letter-spacing="7">AOP → EXECUTION → TRACE → IMPROVEMENT</text><g transform="translate(95 180)"><rect width="420" height="540" rx="14" fill="#15130f" stroke="#4b453c" stroke-width="2"/><text x="38" y="65" fill="#dda660" font-family="monospace" font-size="19">01 / NATURAL LANGUAGE SOP</text><text x="38" y="135" fill="#f0ece3" font-family="sans-serif" font-size="34" font-weight="700">当用户提出退差价</text><g fill="#29251f"><rect x="38" y="185" width="340" height="55" rx="7"/><rect x="38" y="260" width="305" height="55" rx="7"/><rect x="38" y="335" width="355" height="55" rx="7"/><rect x="38" y="410" width="275" height="55" rx="7"/></g><g fill="#b7b1a8" font-family="sans-serif" font-size="19"><text x="58" y="220">读取订单与价格状态</text><text x="58" y="295">检查授权与适用规则</text><text x="58" y="370">调用工具并回写结果</text><text x="58" y="445">异常则停止并转交</text></g></g><path d="M535 450h150" stroke="#dda660" stroke-width="5"/><path d="M665 435l25 15-25 15" fill="#dda660"/><g transform="translate(690 180)"><rect width="360" height="540" rx="14" fill="#15130f" stroke="#4b453c" stroke-width="2"/><text x="35" y="65" fill="#dda660" font-family="monospace" font-size="19">02 / RUNTIME TRACE</text><circle cx="180" cy="225" r="90" fill="none" stroke="#dda660" stroke-width="18" stroke-dasharray="220 70"/><text x="180" y="218" fill="#f0ece3" font-family="Arial" font-size="28" font-weight="700" text-anchor="middle">每一步</text><text x="180" y="253" fill="#a7a097" font-family="sans-serif" font-size="18" text-anchor="middle">可解释</text><g stroke="#4b453c"><path d="M40 365h280M40 430h280M40 495h280"/></g><g fill="#999188" font-family="monospace" font-size="16"><text x="45" y="400">INPUT  / 已读取订单</text><text x="45" y="465">RULE   / 授权范围内</text><text x="45" y="530">ACTION / 调用退差价工具</text></g></g><path d="M1050 450h150" stroke="#dda660" stroke-width="5"/><path d="M1180 435l25 15-25 15" fill="#dda660"/><g transform="translate(1205 180)"><rect width="300" height="540" rx="14" fill="#dda660"/><text x="30" y="65" fill="#17120c" font-family="monospace" font-size="19">03 / ITERATE</text><text x="30" y="150" fill="#17120c" font-family="Arial" font-size="45" font-weight="700">测试</text><text x="30" y="215" fill="#17120c" font-family="Arial" font-size="45" font-weight="700">监控</text><text x="30" y="280" fill="#17120c" font-family="Arial" font-size="45" font-weight="700">版本</text><text x="30" y="345" fill="#17120c" font-family="Arial" font-size="45" font-weight="700">建议</text><path d="M30 400h240" stroke="#7b5527"/><text x="30" y="450" fill="#3b2a15" font-family="sans-serif" font-size="18">业务变化时</text><text x="30" y="482" fill="#3b2a15" font-family="sans-serif" font-size="18">Agent 也能持续演进</text></g><text x="80" y="835" fill="#746f67" font-family="monospace" font-size="18">INSPIRED BY PUBLIC DECAGON AOP / TESTING / OBSERVABILITY MATERIALS</text></svg>
