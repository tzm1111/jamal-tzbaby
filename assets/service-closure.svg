<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t"><title id="t">真实服务链：事实、授权、执行、状态与接续</title><rect width="1600" height="900" fill="#11100d"/><g font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="90" y="105" fill="#d6ab73" font-size="20" letter-spacing="5">SERVICE / FACTS / RESPONSIBILITY</text><text x="90" y="205" fill="#eee5d6" font-size="56" font-weight="600">会回答之后，事情有没有往前走？</text><text x="92" y="264" fill="#938879" font-size="24">证明当前承担的任务，让处理状态可以查询与接续。</text><g stroke="#6f593b" fill="#191610"><rect x="90" y="345" width="252" height="185" rx="5"/><rect x="382" y="345" width="252" height="185" rx="5"/><rect x="674" y="345" width="252" height="185" rx="5"/><rect x="966" y="345" width="252" height="185" rx="5"/><rect x="1258" y="345" width="252" height="185" rx="5"/></g><g fill="#eee5d6" font-size="30"><text x="120" y="422">识别诉求</text><text x="412" y="422">核对事实</text><text x="704" y="422">规则与授权</text><text x="996" y="422">执行动作</text><text x="1288" y="422">确认状态</text></g><g fill="#998c7a" font-size="19"><text x="120" y="478">承担哪段任务</text><text x="412" y="478">订单、凭证与状态</text><text x="704" y="478">当前是否可以做</text><text x="996" y="478">实际发生了什么</text><text x="1288" y="478">结果与下一步</text></g><g stroke="#d6ab73" stroke-width="2" fill="none"><path d="M342 438H378m-8-7 8 7-8 7M634 438H670m-8-7 8 7-8 7M926 438H962m-8-7 8 7-8 7M1218 438H1254m-8-7 8 7-8 7M800 530V595H1200V652"/></g><rect x="435" y="652" width="860" height="96" fill="#242016" stroke="#8c7049"/><text x="485" y="712" fill="#d6ab73" font-size="27">证据不足 · 未获授权 · 状态不明 → 补充或接续</text><text x="90" y="838" fill="#887b69" font-size="20">提交成功 ≠ 处理完成　　识别现象 ≠ 责任判断</text></g></svg>
